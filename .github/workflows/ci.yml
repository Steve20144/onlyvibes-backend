name: CI

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage

  performance:
    runs-on: ubuntu-latest
    needs: ci
    env:
      PERF_SEED_PREFIX: ci-perf-${{ github.run_id }}-${{ github.run_attempt }}
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Start backend
        env:
          MONGO_URI: mongodb://localhost:27017/ci-db
          NODE_ENV: test
          PORT: 3000
          JWT_SECRET: superSecretVibesKey2026!
        run: |
          npm run start &
          sleep 10

      - name: Seed 100 events for performance tests
        env:
          MONGO_URI: mongodb://localhost:27017/ci-db
        run: |
          node scripts/seedPerfEvents.js --count 100 --prefix "$PERF_SEED_PREFIX"

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg ca-certificates
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 performance tests
        env:
          BASE_URL: http://localhost:3000
          REQUIRE_MIN_EVENTS: '1'
          MIN_EVENTS: '100'
          TARGET_VUS: '160'
          SPIKE_VUS: '200'
          SLEEP_SECONDS: '0'
          REQUEST_TIMEOUT: '10s'
        run: |
          k6 run k6/tests/get-events.load.js
          k6 run k6/tests/get-events.spike.js


      - name: Cleanup seeded events
        if: always()
        env:
          MONGO_URI: mongodb://localhost:27017/ci-db
        run: |
          node scripts/seedPerfEvents.js --cleanup --prefix "$PERF_SEED_PREFIX"

  cd:
    runs-on: ubuntu-latest
    needs: performance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
