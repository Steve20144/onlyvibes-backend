name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  #CI
  ci:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Use Node 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm install

    - name: Run tests with coverage
      run: npm test -- --coverage

    - name: Print coverage metrics
      run: |
        node -e "const fs=require('fs');const path='coverage/coverage-summary.json';if(!fs.existsSync(path)){console.error('Coverage summary not found at',path);process.exit(1);}const total=JSON.parse(fs.readFileSync(path,'utf8')).total;const fmt=p=>`${Number(p.pct).toFixed(2)}%`;console.log('Coverage Metrics are:');console.log(`- ${fmt(total.statements)} Statements,`);console.log(`- ${fmt(total.branches)} Branches,`);console.log(`- ${fmt(total.functions)} Functions,`);console.log(`- ${fmt(total.lines)} Lines`);"

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-html
        path: coverage

  cd:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Deploy Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID}}
          api-key: ${{ secrets.RENDER_API_KEY}}